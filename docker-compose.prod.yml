services:
  clickup-notfy:
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/clickup_notfy.db
    volumes:
      - clickup_notfy_dados:/data
    restart: unless-stopped
    expose:
      - "5000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - clickup-notfy

volumes:
  clickup_notfy_dados:
  caddy_dados:
  caddy_config:
